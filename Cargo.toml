[package]
name = "tpt-crypto-rustls"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "rustls CryptoProvider built on tpt-crypto (pure Rust). Not audited."
readme = "README.md"
categories = ["cryptography", "network-programming"]
keywords = ["tls", "rustls", "crypto-provider", "no-std-adjacent"]

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"] }
getrandom = "0.3"
rsa = "0.9.10"
sha2 = { version = "0.10", features = ["oid"] }
tpt-crypto-aead = { git = "https://github.com/tpt-solutions/tpt-crypto", rev = "8b73d9b13cb1432547a03dd58d8cf8d6231e3784" }
tpt-crypto-curve = { git = "https://github.com/tpt-solutions/tpt-crypto", rev = "8b73d9b13cb1432547a03dd58d8cf8d6231e3784" }
tpt-crypto-hash = { git = "https://github.com/tpt-solutions/tpt-crypto", rev = "8b73d9b13cb1432547a03dd58d8cf8d6231e3784" }
tpt-crypto-sig = { git = "https://github.com/tpt-solutions/tpt-crypto", rev = "8b73d9b13cb1432547a03dd58d8cf8d6231e3784" }

[dev-dependencies]
# Server side of the handshake tests only. Never linked into the library.
rustls-rustcrypto = "0.0.2-alpha"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
